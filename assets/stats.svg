<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Language distribution and repository stats">
  <defs>
    <linearGradient id="sframe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF2D8F" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#E63946" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="cardglow" cx="88%" cy="12%" r="80%">
      <stop offset="0%" stop-color="#FF2D8F" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FF2D8F" stop-opacity="0"/>
    </radialGradient>
    <style>
      .m   { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
      .h   { font-size: 12px; letter-spacing: 2.5px; fill: #FF9ECB; fill-opacity: 0.62; }
      .lg  { font-size: 12.5px; letter-spacing: 0.5px; fill: #FFE3F1; fill-opacity: 0.88; }
      .pc  { font-size: 12.5px; fill: #FF8FC4; fill-opacity: 0.55; }
      .big { font-size: 30px; font-weight: 700; fill: #E63946; }
      .cap { font-size: 10.5px; letter-spacing: 2px; fill: #FF9ECB; fill-opacity: 0.50; }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="248" rx="14" fill="#0A0509" fill-opacity="0.97"/>
  <rect x="1" y="1" width="998" height="248" rx="14" fill="url(#cardglow)"/>
  <rect x="1" y="1" width="998" height="248" rx="14" fill="none" stroke="url(#sframe)" stroke-width="1.5"/>

  <text class="m h" x="48" y="44">LANGUAGE DISTRIBUTION / 38 PUBLIC REPOS</text>

  <g>
    <rect x="48"     y="62" width="112.5" height="22" rx="3" fill="#FF2D8F"/>
    <rect x="160.5"  y="62" width="112.5" height="22"        fill="#FF4BA0"/>
    <rect x="273"    y="62" width="112.5" height="22"        fill="#FF69B1"/>
    <rect x="385.5"  y="62" width="75"    height="22"        fill="#FF87C2"/>
    <rect x="460.5"  y="62" width="56.25" height="22"        fill="#FFA5D3"/>
    <rect x="516.75" y="62" width="56.25" height="22"        fill="#FFBFE0"/>
    <rect x="573"    y="62" width="37.5"  height="22"        fill="#FFD5EB"/>
    <rect x="610.5"  y="62" width="18.75" height="22"        fill="#FFEAF5"/>
    <rect x="629.25" y="62" width="18.75" height="22" rx="3" fill="#FFFFFF"/>
  </g>

  <g>
    <rect x="48" y="115" width="9" height="9" rx="1.5" fill="#FF2D8F"/>
    <text class="m lg" x="65" y="124">Python</text><text class="m pc" x="150" y="124">18.8%</text>

    <rect x="48" y="145" width="9" height="9" rx="1.5" fill="#FF4BA0"/>
    <text class="m lg" x="65" y="154">C++</text><text class="m pc" x="150" y="154">18.8%</text>

    <rect x="48" y="175" width="9" height="9" rx="1.5" fill="#FF69B1"/>
    <text class="m lg" x="65" y="184">JavaScript</text><text class="m pc" x="150" y="184">18.8%</text>

    <rect x="235" y="115" width="9" height="9" rx="1.5" fill="#FF87C2"/>
    <text class="m lg" x="252" y="124">Notebooks</text><text class="m pc" x="352" y="124">12.5%</text>

    <rect x="235" y="145" width="9" height="9" rx="1.5" fill="#FFA5D3"/>
    <text class="m lg" x="252" y="154">TypeScript</text><text class="m pc" x="352" y="154">9.4%</text>

    <rect x="235" y="175" width="9" height="9" rx="1.5" fill="#FFBFE0"/>
    <text class="m lg" x="252" y="184">C</text><text class="m pc" x="352" y="184">9.4%</text>

    <rect x="437" y="115" width="9" height="9" rx="1.5" fill="#FFD5EB"/>
    <text class="m lg" x="454" y="124">HTML</text><text class="m pc" x="545" y="124">6.3%</text>

    <rect x="437" y="145" width="9" height="9" rx="1.5" fill="#FFEAF5"/>
    <text class="m lg" x="454" y="154">Dart</text><text class="m pc" x="545" y="154">3.1%</text>

    <rect x="437" y="175" width="9" height="9" rx="1.5" fill="#FFFFFF"/>
    <text class="m lg" x="454" y="184">C#</text><text class="m pc" x="545" y="184">3.1%</text>
  </g>

  <rect x="700" y="38" width="1.5" height="190" fill="#FF2D8F" fill-opacity="0.22"/>

  <g>
    <text class="m big" x="740" y="74">9</text>
    <text class="m cap" x="740" y="92">LANGUAGES SHIPPED</text>

    <text class="m big" x="740" y="142">38</text>
    <text class="m cap" x="740" y="160">PUBLIC REPOSITORIES</text>

    <text class="m big" x="740" y="210">2023</text>
    <text class="m cap" x="740" y="228">BUILDING HERE SINCE</text>
  </g>
</svg>
